[package]
name = "kintai-craft"
version = "1.0.0"
description = "勤怠クラフト — 出勤簿デスクトップアプリ"
authors = ["kintai-craft"]
edition = "2021"

[lib]
name = "kintai_craft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
